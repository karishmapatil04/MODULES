<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap Example</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.css">
        <style>
            p{
                color: red;
            }
            div{
                border: 1px solid black;
            }
            .container{
                color:aqua;
            }
        </style>
    </head>
    <body>
        <p class="display-4">This is a paragraph.</p>
        <!-- Three auto-equal columns -->
        <!-- Two columns side by side on tablet and above -->
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">Section A</div>
                <div class="col-12 col-md-6 col-lg-4">Section B</div>
                <div class="col-12 col-md-12 col-lg-4">Section C</div>
            </div>
        </div>
    </body>
</html>
