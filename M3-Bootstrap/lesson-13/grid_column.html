<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Example</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .col {
            text-align: center;
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <!-- Two columns side by side on tablet and above -->
    <div class="container">
        <div class="row">
            <div style="background-color: red;" class="col col-12 col-md-6 col-lg-4">Section A</div>
            <div style="background-color: green;" class="col col-12 col-md-6 col-lg-4">Section B</div>
            <div style="background-color: blue;" class="col col-12 col-md-12 col-lg-4">Section C</div>
        </div>
    </div>
</body>

</html>
