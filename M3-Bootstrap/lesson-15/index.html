<!doctype html>
<html>
    <head>
        <title>Containers in bootstrap</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    </head>
    <body>
        <div class="bg-success text-white p-3 my-3">
            <h2>Reading</h2>
            <p>I love reading adventure stories.</p>
        </div>
        <div class="container bg-danger">
            <h1>My content goes here</h1>
            <p>It stays neat and centred.</p>
        </div>
        <div class="container-fluid bg-primary text-white p-4">
            <h1>My Hobby Hub</h1>
            <p>A page about the things I love to do!</p>
        </div>
    </body>
</html>
