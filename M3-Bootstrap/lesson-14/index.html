<!DOCTYPE html>
<html>
    <head>
        <title>Typography</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            .display-1 {
                font-size: 2rem;
            }
        </style>
    </head>
    <body>
        <!-- A normal paragraph -->
        <p>Hello!</p>
        <!-- A huge Bootstrap display heading -->
        <p class="display-1">Hello!</p>

        <p>This is my first paragraph we are going to learn <code>typography</code>
        </p>

        <p>My favourite is a good old
            <abbr title="Iredesola">Ire</abbr>.
        </p>

        <blockquote>
            <p>"First we eat, then we do everything else."</p>
            <p>— M.F.K. Fisher</p>
        </blockquote>
    </body>
</html>
