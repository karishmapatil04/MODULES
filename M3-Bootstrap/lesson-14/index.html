<!DOCTYPE html>
<html>
    <head>
        <title>
            Typography
        </title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <p class="display-4">Hello <small>everyone</small> how are you? hope everyone doing <mark>good</mark></p>

        <p>My favourite is a good old
            <abbr title="codingal">cdl</abbr>.
        </p>
        

        <blockquote>
            <p>"First we eat, then we do everything else."</p>
            <p>— M.F.K. Fisher</p>
        </blockquote>
    </body>
</html>
