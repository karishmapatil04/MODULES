<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Arrow Function</h2>
        <p>This example shows an Arrow Function with a parameter.</p>
        <p id="result"></p>
        <script>
            opr = (a, b, c) => a + b - c;
            document.getElementById("result").innerHTML = opr(40, 6,10);
        </script>
    </body>
</html>
