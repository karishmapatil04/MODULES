<!DOCTYPE html>
<html>

<body>

    <p>Finding the largest number with help of Argument Objects </p>
    <p id="result"></p>
    <script>
        function findSum() {
            var sum = 0;
            for (i = 0; i < arguments.length; i++) {
                    sum += arguments[i];
            }
            return sum;
        }
        document.getElementById("result").innerHTML = findSum(1, 4, 2,8,2);
    </script>

</body>

</html>
