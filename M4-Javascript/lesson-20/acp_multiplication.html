<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <button onclick="multiply(4,8)">Click Me!</button>
    <p id="result"></p>

    <script>
        function multiply(a, b) {
            if (b === undefined) {
                b = 5;
            }
            var result = a * b;
            document.getElementById("result").innerHTML = result;
        }

    </script>
</body>
</html>
