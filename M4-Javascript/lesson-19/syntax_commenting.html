<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Comments</title>
</head>
<body>
    <!--learning javascript-->
    <h1 id="myH"></h1>
    <p id="myP"></p>
    <p id="myP1"></p>
    
    <script>
        // My heading:
        document.getElementById("myH").innerHTML = "JavaScript Comments";
        // My paragraph:
        document.getElementById("myP").innerHTML = "My first paragraph.";
        // My second paragraph:
        document.getElementById("myP1").innerHTML = "My second paragraph.";
    </script>
</body>
</html>
