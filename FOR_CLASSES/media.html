<!DOCTYPE html>
<html>
    <head>
        <title>Media in HTML</title>
    </head>
    <body>
        <h1>Images in html</h1>
        <img src="https://tse3.mm.bing.net/th/id/OIP.R5XAcJIUGf_1FPGJiTls2wHaE8?pid=Api&P=0&h=180"  alt="flower image" width="100" height="100">

        <!--Syntax for adding audio-->
        <h1>Audio in html</h1>
        <audio controls>
            <source src="loop_music.mp3" type="audio/mpeg">
            your browser is not supporting audio
        </audio>

        <h1>Video in html</h1>
        <video width="300" height="200" controls>
            <source src="why_coding_imp.mp4" type="video/mp4">
            your browser is not supporting audio
        </video>
    </body>
</html>
