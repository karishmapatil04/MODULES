<!DOCTYPE html>
<html>
    <head>
        <title>Text Styling</title>
        <style>
            /*typography*/
            .hero-name {
            font-family: Arial, sans-serif;
            font-size: 60px;
            font-weight: bold;
            color: red;
            font-style: italic;
            }

            /*text-decoration*/
            .label {
            text-decoration: underline;
            }
            .weakness {
            text-decoration: line-through;
            }

            /*text-transform*/
            .label {
            text-transform: uppercase;
            }
            .tagline {
            text-transform: capitalize;
            }

            /*transform*/
            .badge {
                transform: rotate(15deg);
            }
                
            /*text-shadow*/
            .hero-name {
            text-shadow: 3px 3px orange;
            }

        </style>
    </head>
    <body>
        <h1 class="hero-name">Hero Name</h1>
        <p class="label">This is a labeled paragraph.</p>
        <p class="weakness">This is a weak paragraph.</p>   
        <p class="tagline">this is a tagline paragraph.</p>
        <br><br>
        <p class="badge">This is a badge paragraph.</p>
    </body>
</html>
