<!DOCTYPE html>
<html>
    <head>
        <title>My css lesson</title>
        <style>
            h1{background-color: yellow;}
            .sub-heading { 
                background-color: lightgreen; 
                font-size: 30px; }
            #main-heading { 
                color: purple; font-size: 50px; }
        </style>
    </head>
    <body>
        <h1 id="main-heading">My first css lesson</h1>
        <p style="color: blue;">This is a paragraph</p>
        <h2 class="sub-heading">This is my h2 heading</h2>
    </body>
</html>
