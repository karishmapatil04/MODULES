<!DOCTYPE html>
<html>
    <head>
        <title>Introduction to CSS</title>
        <style>
            /* Universal Selector */
            * {
            font-size: 16px;
            }
            /* Element Selectors */
            h1 {
            color: darkblue;
            }
            p {
            color: dimgray;
            }

            .para1{
                color:aqua
            }
            .para2{
                color:red;
            }
            #my-card{
                color:rgb(157, 96, 17)
            }
        </style>
    </head>
    <body>
        <h1>Heading one</h1>
        <!-- HTML -->
        <p class="para1">My name is Sam.</p>
        <p class="para2">My favourite food is pasta.</p>
        <div id="my-card"> define or using id... </div>
    </body>
</html>
