<!DOCTYPE html>
<html>
<head>
    <style>
        div {
            right: 300px;
            border: 3px solid #73AD21;
        }
        .absolute {
            position: absolute;
            left: 50px;
            border: 3px solid blue;
        }
        .relative {
            position: relative;
            top: 100px;
            left:200px;
            border: 3px solid #52aed2;
        }
        .fixed {
            position: fixed;
            top: 20px;
            right: 40px;
            width: 300px;
            border: 3px solid #ad3d21;
        }
        .sticky {
            position: sticky;
            top: 40px;
            left: 200px;
            width: 100px;
            border: 3px solid #ad218a;
        }
    </style>
</head>

<body>
    <h2>POSITIONING</h2>
    <div>
        Div with no position property
    </div>
    <div class="sticky">
        Div with sticky position property
    </div>
    <div class="relative">
        This div element has position: relative;
        <div class="absolute">
            Absolute class DIV
        </div>
    </div>
    <div class="fixed">
        Div with fixed position property
    </div>

    <br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
