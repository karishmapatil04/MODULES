<!DOCTYPE html>
<html>
    <head>
        <title>Form in html</title>
    </head>
    <body>
        <form>
        <h1>Personal details form</h1>
        <label>Name</label>
        <input type="text" id="name"><br><br>
        
        <label>Email ID</label>
        <input type="email" id="email"><br><br>
        
        <label>Contact Number (This will be hidden)</label>
        <input type="number" id="contact"><br><br>

        <label>Gender</label><br>
        <input type="radio" id="female" name="gender" value="Female">Female<br> 
        <input type="radio" id="male" name="gender" value="Male">Male<br><br>

        <label>Favourite City</label><br>
        <input type="checkbox" id="city" value="Legos">Legos<br>
        <input type="checkbox" id="city" value="Mumbai">Mumbai<br><br>

        <input type="submit">
        </form>
    </body>
</html>
